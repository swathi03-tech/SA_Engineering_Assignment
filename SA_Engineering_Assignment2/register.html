
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #e6e6fa, #d8b4f8);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background-color: white;
    padding: 35px;
    width: 380px;
    max-width: 90%;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(100, 50, 150, 0.2);
}

h1 {
    text-align: center;
    color: #663399;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: #9370db;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #663399;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 20px;
    border: 2px solid #d8b4f8;
    border-radius: 10px;
    background-color: #faf5ff;
    outline: none;
}

input:focus {
    border-color: #9370db;
}

button {
    width: 100%;
    padding: 13px;
    background-color: #9370db;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background-color: #663399;
}

    </style>
</head>
<body>

    <div class="container">
        <h1>Registration Form</h1>
        <p>Create your account</p>

        <form>
            <label>Name</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter your phone number" required>

            <label>Email ID</label>
            <input type="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" placeholder="Enter password" required>

            <button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
